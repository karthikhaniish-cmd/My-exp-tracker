{% extends "layout.html" %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold mb-1">Smart Spending Insights</h2>
    <p class="text-muted mb-0">Automated analytical evaluation based strictly on your recorded financial activity</p>
</div>

<div class="row g-3" id="insights-container">
    <div class="col-12 text-center py-5 text-muted">Analyzing your financial records...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadInsights() {
    try {
        const res = await fetch('/api/ai/insights');
        const data = await res.json();
        const container = document.getElementById('insights-container');
        if (!data.success || !container) return;
        container.innerHTML = '';

        data.insights.forEach(item => {
            let borderClass = "border-info";
            let badgeClass = "bg-info text-dark";
            if (item.type === 'positive') { borderClass = "border-success"; badgeClass = "bg-success"; }
            if (item.type === 'warning') { borderClass = "border-warning"; badgeClass = "bg-warning text-dark"; }
            if (item.type === 'alert') { borderClass = "border-danger"; badgeClass = "bg-danger"; }

            const col = document.createElement('div');
            col.className = 'col-md-6 mb-3';
            col.innerHTML = `
                <div class="fintech-card border ${borderClass} h-100">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="fw-bold mb-0">${item.title}</h5>
                        <span class="badge ${badgeClass}">${item.type.toUpperCase()}</span>
                    </div>
                    <p class="text-secondary mb-0">${item.message}</p>
                </div>
            `;
            container.appendChild(col);
        });
    } catch (e) {
        console.error(e);
    }
}
document.addEventListener('DOMContentLoaded', loadInsights);
</script>
{% endblock %}
