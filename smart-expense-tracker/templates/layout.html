<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker 💰 — Fintech SaaS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
        <div class="brand-header">
            <div class="brand-icon">₹</div>
            <div>
                <div class="brand-title">Smart Expense</div>
                <small class="text-muted" style="font-size: 11px;">Fintech SaaS Platform</small>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="/" class="nav-link-custom {% if active_page == 'dashboard' %}active{% endif %}">
                <i class="fa-solid fa-chart-pie"></i> Dashboard
            </a>
            <a href="/transactions" class="nav-link-custom {% if active_page == 'transactions' %}active{% endif %}">
                <i class="fa-solid fa-list-check"></i> Transactions
            </a>
            <a href="/budgets" class="nav-link-custom {% if active_page == 'budgets' %}active{% endif %}">
                <i class="fa-solid fa-piggy-bank"></i> Budgets
            </a>
            <a href="/analytics" class="nav-link-custom {% if active_page == 'analytics' %}active{% endif %}">
                <i class="fa-solid fa-chart-line"></i> Analytics
            </a>
            <a href="/recurring" class="nav-link-custom {% if active_page == 'recurring' %}active{% endif %}">
                <i class="fa-solid fa-repeat"></i> Recurring
            </a>
            <a href="/insights" class="nav-link-custom {% if active_page == 'insights' %}active{% endif %}">
                <i class="fa-solid fa-wand-magic-sparkles"></i> AI Insights
            </a>
            <a href="/settings" class="nav-link-custom {% if active_page == 'settings' %}active{% endif %}">
                <i class="fa-solid fa-sliders"></i> Settings
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white" style="width: 32px; height: 32px; font-size: 12px;">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div style="line-height: 1.2;">
                    <div style="font-size: 13px; font-weight: 600;">Alex Mercer</div>
                    <small class="text-muted" style="font-size: 10px;">Pro Plan</small>
                </div>
            </div>
            <a href="/logout" class="text-muted" title="Logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <!-- Add Transaction Modal -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-fintech p-3">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Add Transaction</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-tx-form">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Type</label>
                            <select id="tx-type" class="form-select form-select-fintech">
                                <option value="EXPENSE">Expense</option>
                                <option value="INCOME">Income</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Amount</label>
                            <input type="number" id="tx-amount" step="0.01" class="form-control form-control-fintech" placeholder="0.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Description</label>
                            <input type="text" id="tx-description" class="form-control form-control-fintech" placeholder="e.g. Swiggy dinner, Uber to work" required>
                            <span id="smart-category-suggestion" class="badge bg-warning text-dark mt-2 cursor-pointer" style="display: none; cursor: pointer;"></span>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label text-muted small">Category</label>
                                <select id="tx-category" class="form-select form-select-fintech">
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Shopping">Shopping</option>
                                    <option value="Bills">Bills</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Education">Education</option>
                                    <option value="Health">Health</option>
                                    <option value="Travel">Travel</option>
                                    <option value="Salary">Salary</option>
                                    <option value="Freelance">Freelance</option>
                                    <option value="Investment">Investment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small">Payment Method</label>
                                <select id="tx-payment" class="form-select form-select-fintech">
                                    <option value="UPI">UPI</option>
                                    <option value="Credit Card">Credit Card</option>
                                    <option value="Debit Card">Debit Card</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Date</label>
                            <input type="date" id="tx-date" class="form-control form-control-fintech" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Notes</label>
                            <input type="text" id="tx-notes" class="form-control form-control-fintech" placeholder="Optional remarks">
                        </div>
                        <button type="submit" class="btn btn-fintech-primary w-100 mt-2">SAVE TRANSACTION</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('tx-date');
            if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
