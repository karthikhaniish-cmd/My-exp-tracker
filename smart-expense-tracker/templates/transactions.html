{% extends "layout.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">Transaction History</h2>
        <p class="text-muted mb-0">Search, filter, and audit all financial entries</p>
    </div>
    <div class="d-flex gap-2">
        <a href="/api/export/csv" class="btn btn-fintech-outline"><i class="fa-solid fa-file-csv me-1"></i> Export CSV</a>
        <button class="btn btn-fintech-primary" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
            <i class="fa-solid fa-plus me-1"></i> Add Transaction
        </button>
    </div>
</div>

<!-- Search & Filters Bar -->
<div class="fintech-card mb-4">
    <div class="row g-3">
        <div class="col-md-4">
            <input type="text" id="search-input" class="form-control form-control-fintech" placeholder="Search description, notes, category..." oninput="loadTransactions()">
        </div>
        <div class="col-md-2">
            <select id="filter-type" class="form-select form-select-fintech" onchange="loadTransactions()">
                <option value="">All Types</option>
                <option value="EXPENSE">Expense</option>
                <option value="INCOME">Income</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="filter-category" class="form-select form-select-fintech" onchange="loadTransactions()">
                <option value="">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Education">Education</option>
                <option value="Health">Health</option>
                <option value="Travel">Travel</option>
                <option value="Salary">Salary</option>
                <option value="Freelance">Freelance</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="filter-sort" class="form-select form-select-fintech" onchange="loadTransactions()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="highest">Highest Amount</option>
                <option value="lowest">Lowest Amount</option>
            </select>
        </div>
    </div>
</div>

<!-- Transactions Table -->
<div class="fintech-card">
    <div class="table-responsive">
        <table class="fintech-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Payment Method</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="transactions-table-body">
                <tr><td colspan="7" class="text-center py-4 text-muted">Loading transactions...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/transactions.js') }}"></script>
{% endblock %}
