<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Smart Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { width: 100%; max-width: 400px; padding: 30px; }
    </style>
</head>
<body>
    <div class="fintech-card auth-card">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 22px;">₹</div>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted small">Start tracking your personal wealth</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small">Full Name</label>
                <input type="text" name="name" class="form-control form-control-fintech" placeholder="Alex Mercer" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small">Email Address</label>
                <input type="email" name="email" class="form-control form-control-fintech" placeholder="alex@domain.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">Password</label>
                <input type="password" name="password" class="form-control form-control-fintech" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-fintech-primary w-100 mb-3">CREATE ACCOUNT</button>
            <div class="text-center small text-muted">
                Already have an account? <a href="/login" class="text-warning">Login</a>
            </div>
        </form>
    </div>
</body>
</html>
